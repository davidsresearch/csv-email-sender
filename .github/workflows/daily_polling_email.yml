name: Daily Polling Data Email

on:
  schedule:
    - cron: "0 7 * * *" # Runs daily at 7:00 AM UTC
  workflow_dispatch: # Allows manual triggering

jobs:
  scrap-and-email:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      # Step 3: Install Dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests

      # Step 4: Run Scraper Script
      - name: Run scraper
        run: |
          python scripts/scrap_and_convert.py
          
      # Step 5: Send Email with CSVs
      - name: Send email with CSVs
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: davidswelt@gmail.com
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Daily Polling Data Report"
          body: "Attached are the daily polling chart and table data CSV files."
          to: david.kohl@juliusbaer.com
          from: davidswelt@gmail.com
          attachments: |
            chart_data.csv
            table_data.csv