name: Send CSV every Friday

on:
  schedule:
    - cron: '0 7 * * 5'   # Every Friday at 07:00 UTC
  workflow_dispatch:       # Also allows manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Download CSV
        run: |
          curl -L "https://raw.githubusercontent.com/jouchinakajima/program/main/rstar.csv" \
               -o rstar.csv

      - name: Send email with CSV
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: davidswelt@gmail.com
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Weekly rstar.csv"
          body: "Please find the weekly rstar.csv file attached."
          to: david.kohl@juliusbaer.com
          from: davidswelt@gmail.com
          attachments: rstar.csv
